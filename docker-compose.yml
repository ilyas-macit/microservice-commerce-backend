version: '3.9'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-server-2022
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    environment:
      SA_PASSWORD: "${SQL_SA_PASSWORD}"
      ACCEPT_EULA: "Y"
    healthcheck:
      test: [ "CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SQL_SA_PASSWORD}", "-Q", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  #RabbitMQ for Messaging (if needed)
  rabbitmq: 
    image: rabbitmq:4-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - microservices-network
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USERNAME}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    
  # Optional: Redis for Caching (if needed)
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - microservices-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Seq for Centralized Logging
  seq:
    image: datalust/seq:latest
    container_name: seq-logging
    ports:
      - "${SEQ_INGEST_PORT:-5341}:5341"
      - "${SEQ_UI_PORT:-8080}:80"
    environment:
      ACCEPT_EULA: "Y"
    networks:
      - microservices-network
    volumes:
      - seq-data:/data

  auth-service:
    build:
      context: ./src/Services/AuthService
    container_name: auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-5001}:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=Server=sqlserver;Database=${AUTH_DB_NAME:-AuthDb};User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=${AUTH_DB_NAME:-AuthDb};User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__ExpiryMinutes=${JWT_EXPIRY_MINUTES:-60}
    depends_on:
      - sqlserver
    networks:
      - microservices-network

  product-service:
    build:
      context: ./src/Services/ProductService
    container_name: product-service
    ports:
      - "${PRODUCT_SERVICE_PORT:-5002}:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=Server=sqlserver;Database=${PRODUCT_DB_NAME:-ProductDb};User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=${PRODUCT_DB_NAME:-ProductDb};User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__Username=${RABBITMQ_USERNAME}
      - RabbitMq__Password=${RABBITMQ_PASSWORD}
    depends_on:
      - sqlserver
      - redis
      - rabbitmq
      - auth-service
    networks:
      - microservices-network

  log-service:
    build:
      context: ./src/Services/LogService
    container_name: log-service
    ports:
      - "${LOG_SERVICE_PORT:-5003}:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=Server=sqlserver;Database=${LOG_DB_NAME:-LogDb};User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=${LOG_DB_NAME:-LogDb};User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      - Seq__Url=http://seq:80
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__Username=${RABBITMQ_USERNAME}
      - RabbitMq__Password=${RABBITMQ_PASSWORD}
    depends_on:
      - sqlserver
      - seq
      - rabbitmq
    networks:
      - microservices-network

  api-gateway:
    build:
      context: ./src/ApiGateway
    container_name: api-gateway
    ports:
      - "${API_GATEWAY_PORT:-5000}:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - ReverseProxy__Clusters__AuthCluster__Destinations__dest__Address=http://auth-service:8080
      - ReverseProxy__Clusters__ProductCluster__Destinations__dest__Address=http://product-service:8080
      - ReverseProxy__Clusters__LogCluster__Destinations__dest__Address=http://log-service:8080
    depends_on:
      - auth-service
      - product-service
      - log-service
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  sqlserver-data:
    driver: local
  redis-data:
    driver: local
  seq-data:
    driver: local
